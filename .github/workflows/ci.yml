name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        if: ${{ github.repository != VARS.ORGANIZED_EPITECH_REPO }}

        runs-on: ubuntu-latest

        container:
            image: epitechcontent/epitest-docker:latest

        steps:
            - uses: actions/checkout@v7

            - name: make
              run: make

            - name: make codingstyle
              run: make codingstyle

            - name: banned functions
              run: ./test/banned_function.sh

    mirror:
        needs: [build]

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                target_repo_url:
                    ${{ VARS.ORGANIZED_EPITECH_REPO }}
                ssh_private_key:
                    ${{ secrets.SSH_MIRROR_PRIVATE_KEY }}